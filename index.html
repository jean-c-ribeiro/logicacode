<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicaCode</title>
    <style>
        /* Importa a fonte gótica medieval */
        @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #03000a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .epic-text {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 6vw;
            color: #ffffff;
            margin: 0;
            letter-spacing: 3px;
            text-shadow: 
                0 0 10px #00f3ff,
                0 0 20px #00f3ff,
                0 0 40px #8a2be2,
                0 0 80px #8a2be2,
                0 0 120px #8a2be2;
            animation: glowPulse 2.5s infinite alternate, introFade 3s ease-out forwards;
            opacity: 0;
        }

        @keyframes introFade {
            0% { opacity: 0; transform: scale(0.8) translateY(50px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #8a2be2; }
            100% { text-shadow: 0 0 20px #00f3ff, 0 0 40px #8a2be2, 0 0 80px #8a2be2, 0 0 150px #00f3ff; }
        }

        /* Fundo em Canvas para as animações */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    
    <canvas id="neonCanvas"></canvas>
    
    <div class="container">
        <h1 class="epic-text">hello world, meu consagrado!</h1>
        <h4 class="epic-text">-Jean Carlos </h4>
        
    </div>

    <script>
        const canvas = document.getElementById('neonCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*<>/?;{}[]';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            // Rastro escuro para o efeito de cauda das letras
            ctx.fillStyle = 'rgba(3, 0, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                
                // Alterna as cores das partículas entre azul e roxo neon
                ctx.fillStyle = Math.random() > 0.5 ? '#00f3ff' : '#8a2be2';
                
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
